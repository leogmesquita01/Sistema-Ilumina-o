[theme]
base = "light"
primaryColor = "#15171A"
backgroundColor = "#F1F2EE"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#15171A"
font = "sans serif"

[server]
headless = true
port = 8501
# 'true' é o padrão do Streamlit: sem isso, qualquer site aberto no navegador pode
# abrir um WebSocket no app local e disparar ações — inclusive gravações no banco.
enableCORS = true
enableXsrfProtection = true
# Em produção o app não deve se recarregar sozinho quando um arquivo muda.
runOnSave = false

[client]
# Exceção não tratada mostra só o tipo do erro, não o traceback com caminhos e código.
showErrorDetails = "type"
