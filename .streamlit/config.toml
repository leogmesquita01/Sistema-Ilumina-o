[theme]
primaryColor = "#10B981"
backgroundColor = "#080D14"
secondaryBackgroundColor = "#0F1724"
textColor = "#F8FAFC"
font = "sans serif"

[server]
headless = true
port = 8501
# 'true' é o padrão do Streamlit: sem isso, qualquer site aberto no navegador pode
# abrir um WebSocket no app local e disparar ações — inclusive gravações no banco.
enableCORS = true
enableXsrfProtection = true
runOnSave = true
