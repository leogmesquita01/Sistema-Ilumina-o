[theme]
primaryColor = "#2E644A"
backgroundColor = "#E9EEE9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#202923"
font = "sans serif"

[server]
headless = true
port = 8501
# 'true' é o padrão do Streamlit: sem isso, qualquer site aberto no navegador pode
# abrir um WebSocket no app local e disparar ações — inclusive gravações no banco.
enableCORS = true
enableXsrfProtection = true
runOnSave = true
